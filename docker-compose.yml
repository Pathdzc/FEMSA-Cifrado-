services:
  app:
    build: .
    ports:
      # Solo accesible desde esta misma computadora, no desde la red
      - "127.0.0.1:5000:5000"
    environment:
      # Ruta DENTRO del contenedor. Por defecto, los datos simulados.
      ARCHIVO_DATOS: ${ARCHIVO_DATOS:-datos/simulados/equipos_simulados.csv}
      RUTA_BD: datos/bd/proyecto.db
    volumes:
      # Carpeta de datos reales de tu computadora, montada en SOLO LECTURA.
      # Nunca se copia dentro de la imagen.
      - ${CARPETA_REALES:-./datos/reales}:/app/datos/reales:ro
      # La base de datos se guarda fuera del contenedor y sobrevive a reinicios
      - bd:/app/datos/bd

volumes:
  bd:
