services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      RUTA_BD: datos/bd/proyecto.db
    volumes:
      - ${CARPETA_REALES:-./datos/reales}:/app/datos/reales:ro
      - ./uploads:/app/uploads
      - ./salidas:/app/salidas
      - bd:/app/datos/bd

volumes:
  bd:
