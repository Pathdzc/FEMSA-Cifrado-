{% extends "base.html" %}
{% block title %}Gráficas{% endblock %}

{% block content %}
<h2>Gráficas</h2>

{% if not datos %}
<div class="alert">Primero carga un archivo en el Dashboard.</div>
{% else %}
<div class="card">
  <h3>Estado de control</h3>
  <div id="g-estados"></div>
</div>

<div class="card">
  <h3>Estado de control por país</h3>
  <div id="g-pais"></div>
</div>

<script src="{{ url_for('static', filename='plotly.min.js') }}"></script>
<script>
  const datos = {{ datos | tojson }};

  const colores = {
    "No cifrado": "#c0392b",
    "Sin visibilidad": "#7f8c8d",
    "Cifrado fuera de política": "#e67e22",
    "Cifrado, política sin verificar": "#f1c40f",
    "Cumple": "#27ae60"
  };

  Plotly.newPlot("g-estados", [{
    type: "pie",
    labels: datos.estados.labels, 
    values: datos.estados.values,
    hole: 0.4,
    marker: { colors: datos.estados.labels.map(e => colores[e] || "#999") }
  }], { margin: { t: 20 } }, { responsive: true });
    const trazasPais = Object.keys(colores)
    .filter(e => datos.por_pais.estados[e])
    .map(e => ({
      type: "bar",
      name: e,
      x: datos.por_pais.paises,
      y: datos.por_pais.estados[e],
      marker: { color: colores[e] }
    }));

  Plotly.newPlot("g-pais", trazasPais, {
    barmode: "stack",
    margin: { t: 20 },
    yaxis: { title: "Equipos" }
  }, { responsive: true });
</script>
{% endif %}
{% endblock %}
